  <style>
    /* Temporary holding page: no name, logo or contact details. */
    :root {
      --ink: #262626; --cream: #FAF7EE; --muted: #E6E1D6; --gold: #DEC384;
      --gutter: 20px; --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body { margin: 0; background: var(--ink); color: var(--cream); font-family: "DM Sans", system-ui, sans-serif; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    .page { position: relative; isolation: isolate; display: grid; align-items: end; min-height: 100vh; min-height: 100svh; overflow: hidden; }
    .page__img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; object-position: 60% 50%; }
    /* shade under the words: from the bottom on phones, from the left on wide screens */
    .page::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(to top, rgb(20 20 20 / 0.92) 0%, rgb(20 20 20 / 0.72) 42%, rgb(20 20 20 / 0.15) 100%); }
    .copy { display: grid; gap: 16px; width: 100%; max-width: 1200px; margin-inline: auto; padding: 48px var(--gutter) calc(48px + env(safe-area-inset-bottom)); }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; margin: 0; font-size: 0.8125rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
    .eyebrow::before { content: ""; width: 32px; height: 2px; background: currentColor; }
    h1 { max-width: 12em; margin: 0; font-family: "Outfit", "DM Sans", system-ui, sans-serif; font-size: clamp(2rem, 1.3rem + 3.6vw, 4rem); font-weight: 500; line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance; }
    .lead { max-width: 30rem; margin: 0; font-size: clamp(1rem, 0.95rem + 0.3vw, 1.125rem); color: var(--muted); text-wrap: pretty; }
    @media (min-width: 64em) {
      :root { --gutter: 40px; }
      .page { align-items: center; }
      .page::before { background: linear-gradient(90deg, rgb(20 20 20 / 0.88) 0%, rgb(20 20 20 / 0.6) 45%, rgb(20 20 20 / 0.05) 80%); }
      .copy { gap: 20px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .page__img { animation: settle 14s var(--ease) both; }
      .copy > * { animation: rise 900ms var(--ease) both; }
      .copy > :nth-child(2) { animation-delay: 120ms; }
      .copy > :nth-child(3) { animation-delay: 240ms; }
      @keyframes settle { from { transform: scale(1.06); } to { transform: scale(1); } }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="page__img" src="kitchen-1536.webp" srcset="kitchen-800.webp 800w, kitchen-1536.webp 1536w" sizes="100vw" width="1536" height="1024" alt="" fetchpriority="high">
    <div class="copy">
      <p class="eyebrow">Coming Soon</p>
      <h1>Modern Kitchens for Los Angeles Homes</h1>
      <p class="lead">Our new website is almost ready. Check back soon.</p>
    </div>
  </main>
</body>
</html>
